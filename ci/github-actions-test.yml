name: Software tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-viser.txt pyyaml==6.0.3 pyserial==3.5 scipy==1.15.3
      - run: python -m unittest -v
